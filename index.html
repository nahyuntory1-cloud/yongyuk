<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용역 계약 빨리 끝내기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 13px; background: #f0f4f8; }

  /* ===== LAYOUT ===== */
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 220px; min-width: 220px; background: #1e3a5f; color: #fff;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h1 { font-size: 13px; padding: 16px 14px 12px; border-bottom: 1px solid #2e5080; line-height: 1.5; }
  #sidebar h1 span { display: block; font-size: 10px; opacity: .6; margin-top: 2px; }
  .menu-group { padding: 8px 0; border-bottom: 1px solid #2e5080; }
  .menu-group-label { font-size: 10px; opacity: .5; padding: 4px 14px 2px; text-transform: uppercase; letter-spacing: .5px; }
  .menu-item {
    display: block; padding: 7px 14px; cursor: pointer; font-size: 12px;
    border: none; background: none; color: #cde; text-align: left; width: 100%;
    transition: background .15s;
  }
  .menu-item:hover { background: #2e5080; }
  .menu-item.active { background: #2563eb; color: #fff; font-weight: 600; }
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #toolbar {
    background: #fff; border-bottom: 1px solid #dde; padding: 10px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #toolbar h2 { font-size: 15px; flex: 1; }
  .btn {
    padding: 6px 14px; border-radius: 5px; border: 1px solid #c0cfe0;
    background: #fff; cursor: pointer; font-size: 12px; font-family: inherit;
    transition: background .15s;
  }
  .btn:hover { background: #f0f4f8; }
  .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn-primary:hover { background: #1d4ed8; }
  #content { padding: 24px; flex: 1; }

  /* ===== DATA INPUT FORM ===== */
  .input-section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .input-section h3 { font-size: 13px; color: #1e3a5f; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #e8f0fe; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .input-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: #555; font-weight: 600; }
  .field input, .field select {
    padding: 7px 9px; border: 1px solid #c8d8e8; border-radius: 4px;
    font-size: 13px; font-family: inherit; background: #f8fbff;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #2563eb; background: #fff; }
  .field.highlight input { background: #fffde7; border-color: #f9a825; }

  /* ===== DOCUMENT VIEW ===== */
  .doc-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 8px; }
  .doc-page {
    width: 794px; min-height: 1123px; margin: 0 auto; padding: 60px 70px;
    font-family: '바탕', 'Batang', '굴림', serif; font-size: 11pt;
    line-height: 1.7; background: #fff; position: relative;
  }
  .doc-title {
    text-align: center; font-size: 18pt; font-weight: bold;
    letter-spacing: 6px; margin-bottom: 30px; font-family: '바탕', serif;
  }
  .doc-subtitle { text-align: center; font-size: 13pt; margin-bottom: 20px; }
  table.doc-table {
    width: 100%; border-collapse: collapse; margin-bottom: 12px;
  }
  table.doc-table td, table.doc-table th {
    border: 1px solid #333; padding: 5px 8px; vertical-align: middle;
    font-size: 10.5pt;
  }
  table.doc-table th { background: #f5f5f5; text-align: center; font-weight: bold; }
  .label-cell { background: #f9f9f9; text-align: center; font-weight: bold; white-space: nowrap; }
  .sign-area { text-align: right; margin-top: 30px; line-height: 2.2; }
  .sign-line { display: inline-block; min-width: 120px; border-bottom: 1px solid #333; margin-left: 8px; }
  .doc-body { text-indent: 0; margin-bottom: 10px; }
  .doc-indent { margin-left: 20px; }
  .num-item { margin-bottom: 6px; }
  .seal-box {
    display: inline-block; width: 60px; height: 60px; border: 1px solid #aaa;
    text-align: center; line-height: 60px; font-size: 9pt; color: #aaa;
    vertical-align: middle; margin-left: 8px;
  }
  .right-align { text-align: right; }
  .center { text-align: center; }
  .bold { font-weight: bold; }
  .underline { text-decoration: underline; }
  .mt10 { margin-top: 10px; }
  .mt20 { margin-top: 20px; }
  .mt30 { margin-top: 30px; }
  .mb10 { margin-bottom: 10px; }
  .small { font-size: 9pt; }

  /* ===== EDITABLE DOC ===== */
  td.editable:hover, p.editable:hover, div.editable:hover, span.editable:hover {
    background: #fffde7; cursor: text;
  }
  td.editable:focus, p.editable:focus, div.editable:focus, span.editable:focus {
    outline: 2px solid #2563eb; background: #eff6ff;
  }
  .editable { outline: none; }

  /* ===== 인터랙티브 체크박스 ===== */
  .cb-group { display: inline-flex; flex-direction: column; gap: 3px; }
  .cb-opt {
    cursor: pointer; white-space: nowrap; font-size: 10.5pt;
    padding: 1px 4px; border-radius: 3px; transition: background .1s;
    user-select: none;
  }
  .cb-opt:hover { background: #fffde7; }
  .cb-opt.cb-checked { font-weight: 700; color: #000; }
  /* 선택되면 선택 안 된 항목 숨김 */
  .cb-has-check .cb-opt:not(.cb-checked) { display: none; }
  @media print {
    .cb-opt:not(.cb-checked) { display: none !important; }
  }

  /* ===== PRINT ===== */
  @media print {
    #sidebar, #toolbar { display: none !important; }
    #app { display: block; }
    #main { overflow: visible; }
    #content { padding: 0; }
    .doc-wrap { box-shadow: none; padding: 0; border-radius: 0; }
    .doc-page {
      width: 210mm !important;
      padding: 15mm 18mm !important;
      min-height: auto !important;
      max-height: 277mm !important;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      transform-origin: top left;
    }
    .doc-page.multi { max-height: none !important; overflow: visible; }
    .doc-wrap + .doc-wrap { margin-top: 0 !important; }
    .no-print { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <h1>용역 계약 빨리 끝내기<span>자동 서식 생성 프로그램</span></h1>
    <div class="menu-group">
      <button class="menu-item active" onclick="showPage('input')">📋 데이터 입력</button>
    </div>
    <div class="menu-group">
      <div class="menu-group-label">계약 서류</div>
      <button class="menu-item" onclick="showPage('integrated')">계약이행 통합 서약서</button>
      <button class="menu-item" onclick="showPage('contract')">용역표준계약서</button>
      <button class="menu-item" onclick="showPage('accounting')">관련 회계예규 적용</button>
      <button class="menu-item" onclick="showPage('acceptance')">승낙사항</button>
      <button class="menu-item" onclick="showPage('seal')">사용인감계</button>
      <button class="menu-item" onclick="showPage('bond')">계약보증금납부서</button>
      <button class="menu-item" onclick="showPage('bond_confirm')">계약보증금 지급확약서</button>
    </div>
    <div class="menu-group">
      <div class="menu-group-label">서약 서류</div>
      <button class="menu-item" onclick="showPage('integrity')">청렴서약서</button>
      <button class="menu-item" onclick="showPage('contract_memo')">수의계약 각서</button>
      <button class="menu-item" onclick="showPage('contract_check')">수의계약 체결 제한 여부</button>
      <button class="menu-item" onclick="showPage('tax')">조세포탈 관련 각서</button>
      <button class="menu-item" onclick="showPage('privacy')">개인정보보안서약서</button>
      <button class="menu-item" onclick="showPage('labor')">근로자 권리보호 이행서약서</button>
      <button class="menu-item" onclick="showPage('security_rep')">보안서약서(업체대표)</button>
      <button class="menu-item" onclick="showPage('security_staff')">보안서약서(참여인력)</button>
    </div>
    <div class="menu-group">
      <div class="menu-group-label">이행 서류</div>
      <button class="menu-item" onclick="showPage('start')">착수계</button>
      <button class="menu-item" onclick="showPage('labor_agree')">노무비구분·지급합의서</button>
      <button class="menu-item" onclick="showPage('labor_exclude')">노무비구분·지급제외확인서</button>
      <button class="menu-item" onclick="showPage('labor_mgmt')">노무비구분관리제외확인서</button>
      <button class="menu-item" onclick="showPage('labor_pay')">노무비지급내역서</button>
      <button class="menu-item" onclick="showPage('security_end')">보안확약서(사업종료시)</button>
    </div>
    <div class="menu-group">
      <div class="menu-group-label" style="color:#fbbf24;">⚠ 중대재해 안전서류</div>
      <button class="menu-item" onclick="showPage('safe_plan')">1. 안전보건관리계획서</button>
      <button class="menu-item" onclick="showPage('safe_eval')">2. 수급인 안전보건 수준평가표</button>
      <button class="menu-item" onclick="showPage('safe_meeting')">3. 안전보건협의체 회의록</button>
      <button class="menu-item" onclick="showPage('safe_check')">4. 도급(용역)안전보건 점검표</button>
      <button class="menu-item" onclick="showPage('safe_high')">5. 점검표(고소작업)</button>
      <button class="menu-item" onclick="showPage('safe_fire')">6. 점검표(화기작업)</button>
      <button class="menu-item" onclick="showPage('safe_confined')">7. 점검표(밀폐공간작업)</button>
      <button class="menu-item" onclick="showPage('safe_elec')">8. 점검표(전기작업)</button>
      <button class="menu-item" onclick="showPage('safe_patrol')">9. 작업장 순회점검표</button>
      <button class="menu-item" onclick="showPage('safe_joint')">10. 합동 안전보건점검표</button>
    </div>
    <div class="menu-group">
      <div class="menu-group-label">완료 서류</div>
      <button class="menu-item" onclick="showPage('complete')">완수확인서</button>
      <button class="menu-item" onclick="showPage('payment')">대금청구서</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="toolbar">
      <h2 id="page-title">데이터 입력</h2>
      <span id="edit-badge" class="no-print" style="display:none; background:#d1fae5; color:#065f46; border:1px solid #6ee7b7; border-radius:4px; padding:3px 10px; font-size:11px; font-weight:600;">✏ 클릭하여 직접 수정 가능</span>
      <button id="hwpx-btn" class="btn btn-primary no-print" onclick="downloadHwpx()" style="display:none;">📥 한글(HWPX) 저장</button>
      <button class="btn no-print" onclick="window.print()">🖨 인쇄</button>
    </div>
    <div id="content"></div>
  </div>
</div>

// helpers
function fmt(n) {
  if (!n && n !== 0) return '';
  return Number(n).toLocaleString('ko-KR');
}
function won(n) {
  if (!n && n !== 0) return '';
  const num = Number(n);
  return `금 ${fmt(num)} 원(금 ${numToKorean(num)} 원정)`;
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}년${String(d.getMonth()+1).padStart(2,'0')}월${String(d.getDate()).padStart(2,'0')}일`;
}
function fmtDateDot(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function numToKorean(num) {
  if (!num) return '영';
  const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const positions = ['', '십', '백', '천'];
  const bigUnits = ['', '만', '억', '조'];
  let result = '';
  const str = String(Math.floor(Number(num)));
  const len = str.length;
  for (let i = 0; i < len; i++) {
    const digit = parseInt(str[i]);
    const pos = len - 1 - i;
    const bigPos = Math.floor(pos / 4);
    const smallPos = pos % 4;
    if (digit === 0) continue;
    result += (digit === 1 && smallPos > 0 ? '' : units[digit]) + positions[smallPos];
    if (smallPos === 0) result += bigUnits[bigPos];
  }
  return result || '영';
}

// ===== 체크박스 인터랙션 =====
function pickCB(el) {
  const group = el.closest('.cb-group');
  const opts  = group.querySelectorAll('.cb-opt');
  const wasChecked = el.classList.contains('cb-checked');
  // 모두 초기화
  opts.forEach(o => {
    o.classList.remove('cb-checked');
    o.textContent = o.textContent.replace('[✓]', '[ ]');
  });
  group.classList.remove('cb-has-check');
  // 이미 체크된 걸 다시 클릭 → 해제(토글)
  if (!wasChecked) {
    el.classList.add('cb-checked');
    el.textContent = el.textContent.replace('[ ]', '[✓]');
    group.classList.add('cb-has-check');
  }
}

// cb-group HTML 생성 헬퍼
let _cbIdx = 0;
function cbGroup(...opts) {
  return `<div class="cb-group">${
    opts.map(o => `<span class="cb-opt" onclick="pickCB(this)">[ ] ${o}</span>`).join('')
  }</div>`;
}

function showPage(id) {
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  const allBtns = document.querySelectorAll('.menu-item');
  allBtns.forEach(btn => {
    if (btn.getAttribute('onclick') === `showPage('${id}')`) btn.classList.add('active');
  });
  const p = pages[id];
  if (!p) return;
  document.getElementById('page-title').textContent = p.title;
  document.getElementById('content').innerHTML = p.render();
  if (id !== 'input') {
    // 편집 가능한 요소에 직접 contenteditable 적용 (테이블 셀, 단락, 서명란 등)
    document.querySelectorAll(
      '#content td:not(.label-cell), #content p, #content .doc-body, #content .num-item, #content .sign-area, #content .sign-line, #content .doc-title'
    ).forEach(el => {
      if (el.tagName === 'TD' || el.tagName === 'P' || el.classList.contains('doc-body') ||
          el.classList.contains('num-item') || el.classList.contains('sign-area') ||
          el.classList.contains('sign-line') || el.classList.contains('doc-title')) {
        el.contentEditable = 'true';
        el.spellcheck = false;
        el.classList.add('editable');
      }
    });
    // 체크박스, 도장 박스는 편집 불가
    document.querySelectorAll('.cb-opt, .seal-box, .cb-group').forEach(el => {
      el.contentEditable = 'false';
      el.classList.remove('editable');
    });
    const badge = document.getElementById('edit-badge');
    if (badge) badge.style.display = 'inline-block';
    document.getElementById('hwpx-btn').style.display = 'inline-block';
  } else {
    const badge = document.getElementById('edit-badge');
    if (badge) badge.style.display = 'none';
    document.getElementById('hwpx-btn').style.display = 'none';
  }
}

      <td>${S.업체명s}</td><td></td><td>&nbsp;&nbsp;&nbsp;&nbsp;(서명)</td>
    </tr>
  </table>
</div></div>`;
}

// ===== 한 페이지 인쇄 =====
// A4 인쇄 영역: 가로 794px, 세로 1123px (96dpi 기준), 여백 제외 후 약 1050px
const PRINT_H = 1050;
const PRINT_W = 756;

window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.doc-page:not(.multi)').forEach(page => {
    // 일시적으로 transform 제거 후 실제 크기 측정
    page.style.transform = '';
    const h = page.scrollHeight;
    const w = page.scrollWidth;
    const scale = Math.min(1, PRINT_H / h, PRINT_W / w);
    if (scale < 1) {
      page.style.transform = `scale(${scale})`;
      page.style.transformOrigin = 'top left';
      // transform은 레이아웃 공간을 줄이지 않으므로 여백 보정
      page.style.marginBottom = `${(scale - 1) * h}px`;
      page.style.marginRight = `${(scale - 1) * w}px`;
    }
  });
});

window.addEventListener('afterprint', () => {
  document.querySelectorAll('.doc-page').forEach(page => {
    page.style.transform = '';
    page.style.transformOrigin = '';
    page.style.marginBottom = '';
    page.style.marginRight = '';
  });
});

// ===== 한글(HWPX) 내보내기 =====
// 현재 화면에 보이는 서식(직접 수정한 내용·체크 선택 포함)을 그대로 .hwpx 파일로 저장합니다.
const HWPX = {
  PAGE_W: 59528, PAGE_H: 84186,            // A4 (HWPUNIT, 1mm ≈ 283.46)
  ML: 5669, MR: 5669, MT: 4252, MB: 4252,  // 좌우 20mm, 상하 15mm
  HD: 2834, FT: 2834,
  CELL_ML: 425, CELL_MR: 425, CELL_MT: 141, CELL_MB: 141,
};
HWPX.TEXT_W = HWPX.PAGE_W - HWPX.ML - HWPX.MR;

function hxEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

class HwpxWriter {
  constructor(pxScale) {
    this.px = pxScale;            // 화면 px → HWPUNIT
    this.chars = []; this.charMap = {};
    this.paras = []; this.paraMap = {};
    this.pid = 1; this.tid = 1;
    this.seenBlocks = new WeakSet();
  }
  // 글자 모양 (기본 header의 charPr 0~6 뒤에 7번부터 추가)
  charPr(height, bold) {
    const key = height + '|' + (bold ? 1 : 0);
    if (!(key in this.charMap)) { this.charMap[key] = 7 + this.chars.length; this.chars.push({ height, bold }); }
    return this.charMap[key];
  }
  // 문단 모양 (기본 header의 paraPr 0~19 뒤에 20번부터 추가)
  paraPr(align, indent, prev, next, line, left = 0) {
    const key = [align, indent, prev, next, line, left].join('|');
    if (!(key in this.paraMap)) { this.paraMap[key] = 20 + this.paras.length; this.paras.push({ align, indent, prev, next, line, left }); }
    return this.paraMap[key];
  }
  charXml(id, c) {
    const all = v => `hangul="${v}" latin="${v}" hanja="${v}" japanese="${v}" other="${v}" symbol="${v}" user="${v}"`;
    return `<hh:charPr id="${id}" height="${c.height}" textColor="#000000" shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">` +
      `<hh:fontRef ${all(1)}/><hh:ratio ${all(100)}/><hh:spacing ${all(0)}/><hh:relSz ${all(100)}/><hh:offset ${all(0)}/>` +
      (c.bold ? '<hh:bold/>' : '') +
      `<hh:underline type="NONE" shape="SOLID" color="#000000"/><hh:strikeout shape="NONE" color="#000000"/><hh:outline type="NONE"/><hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/></hh:charPr>`;
  }
  paraXml(id, p) {
    const m = d => `<hh:margin><hc:intent value="${Math.round(p.indent / d)}" unit="HWPUNIT"/><hc:left value="${Math.round(p.left / d)}" unit="HWPUNIT"/><hc:right value="0" unit="HWPUNIT"/><hc:prev value="${Math.round(p.prev / d)}" unit="HWPUNIT"/><hc:next value="${Math.round(p.next / d)}" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${p.line}" unit="HWPUNIT"/>`;
    return `<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR">` +
      `<hh:align horizontal="${p.align}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/>` +
      `<hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="KEEP_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/>` +
      `<hh:autoSpacing eAsianEng="0" eAsianNum="0"/>` +
      `<hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${m(2)}</hp:case><hp:default>${m(1)}</hp:default></hp:switch>` +
      `<hh:border borderFillIDRef="2" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`;
  }
  headerXml(tpl) {
    const side = (t) => `<hh:leftBorder type="${t}" width="0.12 mm" color="#000000"/><hh:rightBorder type="${t}" width="0.12 mm" color="#000000"/><hh:topBorder type="${t}" width="0.12 mm" color="#000000"/><hh:bottomBorder type="${t}" width="0.12 mm" color="#000000"/>`;
    const bf = (id, t, fill) => `<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0"><hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>${side(t)}<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>` +
      (fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#999999" alpha="0"/></hc:fillBrush>` : '') + `</hh:borderFill>`;
    // 3: 실선 테두리, 4: 실선+연회색 음영(제목칸), 5: 테두리 없음
    const fills = bf(3, 'SOLID') + bf(4, 'SOLID', '#F2F2F2') + bf(5, 'NONE');
    const chars = this.chars.map((c, i) => this.charXml(7 + i, c)).join('');
    const paras = this.paras.map((p, i) => this.paraXml(20 + i, p)).join('');
    return tpl
      .replace('<hh:borderFills itemCnt="2">', '<hh:borderFills itemCnt="5">')
      .replace('</hh:borderFills>', fills + '</hh:borderFills>')
      .replace('<hh:charProperties itemCnt="7">', `<hh:charProperties itemCnt="${7 + this.chars.length}">`)
      .replace('</hh:charProperties>', chars + '</hh:charProperties>')
      .replace('<hh:paraProperties itemCnt="20">', `<hh:paraProperties itemCnt="${20 + this.paras.length}">`)
      .replace('</hh:paraProperties>', paras + '</hh:paraProperties>');
  }

  // ---- 화면 요소 → 문단 목록 ----
  blocks(root, availW) {
    const out = [];
    let cur = null;
    const self = this;

    function blockOf(el) {
      let e = el;
      while (e && e !== root && /^inline/.test(getComputedStyle(e).display)) e = e.parentElement;
      return e || root;
    }
    function paraStyle(block, firstLine) {
      const cs = getComputedStyle(block);
      const ta = cs.textAlign;
      const align = ta === 'center' ? 'CENTER' : (ta === 'right' || ta === 'end') ? 'RIGHT' : 'JUSTIFY';
      const fs = parseFloat(cs.fontSize) || 14;
      const lhPx = parseFloat(cs.lineHeight);
      let line = isNaN(lhPx) ? 160 : Math.round(lhPx / fs * 95 / 10) * 10;
      line = Math.max(100, Math.min(300, line));
      const isCell = /^T[DH]$/.test(block.tagName);
      const ti = parseFloat(cs.textIndent) || 0;
      const pad = isCell ? 0 : (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.marginLeft) || 0);
      let indent = 0, prev = 0, left = 0;
      if (ti < 0) { indent = Math.round(ti * self.px); left = Math.max(0, Math.round((pad + ti) * self.px)); }
      else { left = Math.round(pad * self.px); if (firstLine) indent = Math.round(ti * self.px); }
      if (firstLine && !isCell) prev = Math.round((parseFloat(cs.marginTop) || 0) * self.px);
      return self.paraPr(align, indent, prev, 0, line, left);
    }
    function addText(text, el) {
      if (!text) return;
      const cs = getComputedStyle(el);
      const height = Math.round(parseFloat(cs.fontSize) * 0.75 * 10) * 10;
      const w = cs.fontWeight;
      const bold = w === 'bold' || parseInt(w, 10) >= 600;
      const cid = self.charPr(height, bold);
      if (!cur) {
        const block = blockOf(el);
        const first = !self.seenBlocks.has(block);
        self.seenBlocks.add(block);
        cur = { runs: [], pp: paraStyle(block, first), cid };
      }
      const last = cur.runs[cur.runs.length - 1];
      const prevText = cur.runs.map(r => r.t).join('');
      if (text.startsWith(' ') && (prevText === '' || prevText.endsWith(' '))) text = text.replace(/^ +/, '');
      if (!text) return;
      if (last && last.c === cid) last.t += text; else cur.runs.push({ c: cid, t: text });
    }
    function emit(pp, runsXml) {
      out.push(`<hp:p id="${self.pid++}" paraPrIDRef="${pp}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">${runsXml}</hp:p>`);
    }
    function flush() {
      if (!cur) return;
      const runs = cur.runs;
      if (runs.length) {
        runs[runs.length - 1].t = runs[runs.length - 1].t.replace(/ +$/, '');
      }
      const kept = runs.filter(r => r.t !== '');
      if (kept.length) {
        emit(cur.pp, kept.map(r => `<hp:run charPrIDRef="${r.c}"><hp:t>${hxEsc(r.t.replace(/ /g, ' '))}</hp:t></hp:run>`).join(''));
      }
      cur = null;
    }
    function blank(el) {
      const cs = getComputedStyle(el);
      const height = Math.round(parseFloat(cs.fontSize) * 0.75 * 10) * 10;
      emit(paraStyle(blockOf(el), false), `<hp:run charPrIDRef="${self.charPr(height, false)}"><hp:t/></hp:run>`);
    }
    function walk(node) {
      if (node.nodeType === 3) {
        const parent = node.parentElement;
        const ws = getComputedStyle(parent).whiteSpace;
        if (ws.startsWith('pre') || ws === 'break-spaces') {
          node.nodeValue.split('\n').forEach((seg, i) => {
            if (i > 0) { if (cur) flush(); else blank(parent); }
            addText(seg.replace(/\t/g, ' '), parent);
          });
        } else {
          addText(node.nodeValue.replace(/[ \t\n\r\f]+/g, ' '), parent);
        }
        return;
      }
      if (node.nodeType !== 1) return;
      const el = node;
      const cs = getComputedStyle(el);
      if (cs.display === 'none' || el.classList.contains('no-print')) return;
      if (el.tagName === 'BR') { if (cur) flush(); else blank(el.parentElement); return; }
      if (el.tagName === 'TABLE') {
        flush();
        const pp = self.paraPr('LEFT', 0, Math.round((parseFloat(cs.marginTop) || 0) * self.px),
                                         Math.round((parseFloat(cs.marginBottom) || 0) * self.px), 100);
        emit(pp, `<hp:run charPrIDRef="0">${self.table(el, availW)}<hp:t/></hp:run>`);
        return;
      }
      if (el.classList.contains('seal-box')) { addText(' (인)', el); return; }
      if (el.classList.contains('cb-group')) {
        flush();
        [...el.querySelectorAll('.cb-opt')].filter(o => getComputedStyle(o).display !== 'none')
          .forEach(o => { addText(o.textContent.trim(), o); flush(); });
        return;
      }
      const isBlock = !/^inline/.test(cs.display);
      if (isBlock) flush();
      el.childNodes.forEach(walk);
      if (isBlock) flush();
    }

    walk(root);
    flush();
    return out;
  }

  // ---- 표 ----
  table(tbl, availW) {
    const rows = [...tbl.rows].filter(tr => tr.closest('table') === tbl);
    const nRows = rows.length;
    const grid = rows.map(() => []);
    const cells = [];
    rows.forEach((tr, r) => {
      let c = 0;
      [...tr.cells].forEach(td => {
        while (grid[r][c]) c++;
        const cs = Math.max(1, td.colSpan || 1);
        const rs = Math.max(1, Math.min(td.rowSpan || 1, nRows - r));
        for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) grid[r + i][c + j] = td;
        cells.push({ td, r, c, cs, rs });
        c += cs;
      });
    });
    const nCols = Math.max(1, ...grid.map(g => g.length));
    // 빈 칸 채우기 (한글 표는 모든 격자가 채워져 있어야 함)
    for (let r = 0; r < nRows; r++) for (let c = 0; c < nCols; c++) {
      if (!grid[r][c]) { grid[r][c] = 'empty'; cells.push({ td: null, r, c, cs: 1, rs: 1 }); }
    }
    // 열 너비: 화면에서 실제 너비 측정
    const colW = new Array(nCols).fill(0);
    cells.forEach(k => { if (k.td && k.cs === 1) colW[k.c] = Math.max(colW[k.c], k.td.getBoundingClientRect().width); });
    cells.forEach(k => {
      if (!k.td || k.cs === 1) return;
      const span = colW.slice(k.c, k.c + k.cs);
      const unknown = span.filter(v => !v).length;
      if (unknown) {
        const rest = Math.max(0, k.td.getBoundingClientRect().width - span.reduce((a, b) => a + b, 0));
        for (let j = k.c; j < k.c + k.cs; j++) if (!colW[j]) colW[j] = rest / unknown || 1;
      }
    });
    const avg = colW.filter(v => v).reduce((a, b) => a + b, 0) / (colW.filter(v => v).length || 1) || 50;
    for (let j = 0; j < nCols; j++) if (!colW[j]) colW[j] = avg;
    const tblPx = colW.reduce((a, b) => a + b, 0);
    const colHU = colW.map(v => Math.round(v / tblPx * availW));
    colHU[nCols - 1] += availW - colHU.reduce((a, b) => a + b, 0);
    // 행 높이
    const rowHU = rows.map(tr => Math.max(1000, Math.round(tr.getBoundingClientRect().height * this.px * 0.85)));

    const tid = this.tid++;
    const byRow = rows.map(() => []);
    cells.forEach(k => byRow[k.r].push(k));
    const trs = byRow.map(list => '<hp:tr>' + list.sort((a, b) => a.c - b.c).map(k => {
      const w = colHU.slice(k.c, k.c + k.cs).reduce((a, b) => a + b, 0);
      const h = rowHU.slice(k.r, k.r + k.rs).reduce((a, b) => a + b, 0);
      let bf = 3, va = 'CENTER', paras = [];
      if (k.td) {
        const cs = getComputedStyle(k.td);
        const bg = cs.backgroundColor;
        const noBorder = cs.borderTopStyle === 'none' && cs.borderLeftStyle === 'none' && cs.borderRightStyle === 'none' && cs.borderBottomStyle === 'none';
        const shaded = bg && !/rgba\(0, 0, 0, 0\)|transparent|rgb\(255, 255, 255\)/.test(bg);
        bf = noBorder ? 5 : shaded ? 4 : 3;
        va = cs.verticalAlign === 'top' ? 'TOP' : cs.verticalAlign === 'bottom' ? 'BOTTOM' : 'CENTER';
        paras = this.blocks(k.td, Math.max(1000, w - HWPX.CELL_ML - HWPX.CELL_MR));
      }
      if (!paras.length) paras = [`<hp:p id="${this.pid++}" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${this.charPr(1000, false)}"><hp:t/></hp:run></hp:p>`];
      return `<hp:tc name="" header="0" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="${bf}">` +
        `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${va}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${paras.join('')}</hp:subList>` +
        `<hp:cellAddr colAddr="${k.c}" rowAddr="${k.r}"/><hp:cellSpan colSpan="${k.cs}" rowSpan="${k.rs}"/>` +
        `<hp:cellSz width="${w}" height="${h}"/><hp:cellMargin left="${HWPX.CELL_ML}" right="${HWPX.CELL_MR}" top="${HWPX.CELL_MT}" bottom="${HWPX.CELL_MB}"/></hp:tc>`;
    }).join('') + '</hp:tr>').join('');
    const totalH = rowHU.reduce((a, b) => a + b, 0);
    return `<hp:tbl id="${tid}" zOrder="${tid}" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="0" rowCnt="${nRows}" colCnt="${nCols}" cellSpacing="0" borderFillIDRef="5" noAdjust="0">` +
      `<hp:sz width="${availW}" widthRelTo="ABSOLUTE" height="${totalH}" heightRelTo="ABSOLUTE" protect="0"/>` +
      `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
      `<hp:outMargin left="0" right="0" top="0" bottom="0"/>` +
      `<hp:inMargin left="${HWPX.CELL_ML}" right="${HWPX.CELL_MR}" top="${HWPX.CELL_MT}" bottom="${HWPX.CELL_MB}"/>` +
      trs + `</hp:tbl>`;
  }
}

const HWPX_NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/hwpml/2016/ooxmlchart" xmlns:hwpunitchar="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';
const XML_DECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>';

function hwpxSecPrRun() {
  const nb = `<hp:noteSpacing betweenNotes="283" belowLine="567" aboveLine="850"/>`;
  const pbf = t => `<hp:pageBorderFill type="${t}" borderFillIDRef="1" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill>`;
  return `<hp:run charPrIDRef="0"><hp:secPr id="" textDirection="HORIZONTAL" spaceColumns="1134" tabStop="8000" tabStopVal="4000" tabStopUnit="HWPUNIT" outlineShapeIDRef="1" memoShapeIDRef="0" textVerticalWidthHead="0" masterPageCnt="0">` +
    `<hp:grid lineGrid="0" charGrid="0" wonggojiFormat="0"/><hp:startNum pageStartsOn="BOTH" page="0" pic="0" tbl="0" equation="0"/>` +
    `<hp:visibility hideFirstHeader="0" hideFirstFooter="0" hideFirstMasterPage="0" border="SHOW_ALL" fill="SHOW_ALL" hideFirstPageNum="0" hideFirstEmptyLine="0" showLineNumber="0"/>` +
    `<hp:lineNumberShape restartType="0" countBy="0" distance="0" startNumber="0"/>` +
    `<hp:pagePr landscape="WIDELY" width="${HWPX.PAGE_W}" height="${HWPX.PAGE_H}" gutterType="LEFT_ONLY"><hp:margin header="${HWPX.HD}" footer="${HWPX.FT}" gutter="0" left="${HWPX.ML}" right="${HWPX.MR}" top="${HWPX.MT}" bottom="${HWPX.MB}"/></hp:pagePr>` +
    `<hp:footNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="-1" type="SOLID" width="0.12 mm" color="#000000"/>${nb}<hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="EACH_COLUMN" beneathText="0"/></hp:footNotePr>` +
    `<hp:endNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="14692344" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="0" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="END_OF_DOCUMENT" beneathText="0"/></hp:endNotePr>` +
    pbf('BOTH') + pbf('EVEN') + pbf('ODD') +
    `</hp:secPr><hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl></hp:run>`;
}

function buildHwpxFiles(pageEls, title) {
  if (!Array.isArray(pageEls)) pageEls = [pageEls];
  const pageEl = pageEls[0];
  const contentPx = pageEl.clientWidth - parseFloat(getComputedStyle(pageEl).paddingLeft) - parseFloat(getComputedStyle(pageEl).paddingRight);
  const w = new HwpxWriter(HWPX.TEXT_W / contentPx);
  const paras = [];
  pageEls.forEach((pg, i) => {
    const ps = w.blocks(pg, HWPX.TEXT_W);
    if (i > 0 && ps.length) ps[0] = ps[0].replace('pageBreak="0"', 'pageBreak="1"');
    paras.push(...ps);
  });
  if (!paras.length) paras.push(`<hp:p id="0" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="0"><hp:t/></hp:run></hp:p>`);
  paras[0] = paras[0].replace(/^(<hp:p [^>]*>)/, '$1' + hwpxSecPrRun());
  const section = `${XML_DECL}<hs:sec ${HWPX_NS}>${paras.join('')}</hs:sec>`;
  const header = w.headerXml(document.getElementById('hwpx-header-tpl').textContent.trim());
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const hpf = `${XML_DECL}<opf:package ${HWPX_NS} version="" unique-identifier="" id=""><opf:metadata><opf:title>${hxEsc(title)}</opf:title><opf:language>ko</opf:language><opf:meta name="creator" content="text">용역 계약 빨리 끝내기</opf:meta><opf:meta name="subject" content="text"/><opf:meta name="description" content="text"/><opf:meta name="lastsaveby" content="text">용역 계약 빨리 끝내기</opf:meta><opf:meta name="CreatedDate" content="text">${now}</opf:meta><opf:meta name="ModifiedDate" content="text">${now}</opf:meta><opf:meta name="keyword" content="text"/></opf:metadata><opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/><opf:item id="settings" href="settings.xml" media-type="application/xml"/></opf:manifest><opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>`;
  const prvText = pageEls.map(p => p.innerText || '').join('\n').replace(/\s+\n/g, '\n').slice(0, 1000);
  return [
    ['mimetype', 'application/hwp+zip', true],
    ['version.xml', `${XML_DECL}<hv:HCFVersion xmlns:hv="http://www.hancom.co.kr/hwpml/2011/version" tagetApplication="WORDPROCESSOR" major="5" minor="1" micro="1" buildNumber="0" os="1" xmlVersion="1.5" application="Hancom Office Hangul" appVersion="13, 0, 0, 1408 WIN32LEWindows_10"/>`],
    ['META-INF/container.xml', `${XML_DECL}<ocf:container xmlns:ocf="urn:oasis:names:tc:opendocument:xmlns:container" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf"><ocf:rootfiles><ocf:rootfile full-path="Contents/content.hpf" media-type="application/hwpml-package+xml"/><ocf:rootfile full-path="Preview/PrvText.txt" media-type="text/plain"/><ocf:rootfile full-path="META-INF/container.rdf" media-type="application/rdf+xml"/></ocf:rootfiles></ocf:container>`],

// ---- 외부 라이브러리 없는 ZIP 작성기 ----
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function deflateRaw(data) {
  if (typeof CompressionStream === 'undefined') return null;
  try {
    const s = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  } catch (e) { return null; }
}
async function makeZip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const [name, text, store] of files) {
    const nameB = enc.encode(name);
    const raw = enc.encode(text);
    const crc = crc32(raw);
    let body = raw, method = 0;
    if (!store) { const z = await deflateRaw(raw); if (z) { body = z; method = 8; } }
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, method, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, raw.length, true);
    lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameB, body);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, method, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, raw.length, true);
    ch.setUint16(28, nameB.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameB);
    offset += 30 + nameB.length + body.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/hwp+zip' });
}

async function downloadHwpx() {
  const pageEls = [...document.querySelectorAll('#content .doc-page')];
  if (!pageEls.length) { alert('서식 화면에서 사용하세요.'); return; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const title = document.getElementById('page-title').textContent.trim();
  try {
    const blob = await makeZip(buildHwpxFiles(pageEls, title));
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '').trim();
    const fname = [safe(title), safe(D.업체명 || S.업체명s)].filter(Boolean).join('_') + '.hwpx';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) {
    console.error(e);
    alert('HWPX 저장 중 오류가 발생했습니다: ' + e.message);
  }
}
