<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>용역 계약 빨리 끝내기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 13px; background: #f0f4f8; }

  /* ===== LAYOUT ===== */
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 220px; min-width: 220px; background: #1e3a5f; color: #fff;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #sidebar h1 { font-size: 13px; padding: 16px 14px 12px; border-bottom: 1px solid #2e5080; line-height: 1.5; }
  #sidebar h1 span { display: block; font-size: 10px; opacity: .6; margin-top: 2px; }
  .menu-group { padding: 8px 0; border-bottom: 1px solid #2e5080; }
  .menu-group-label { font-size: 10px; opacity: .5; padding: 4px 14px 2px; text-transform: uppercase; letter-spacing: .5px; }
  .menu-item {
    display: block; padding: 7px 14px; cursor: pointer; font-size: 12px;
    border: none; background: none; color: #cde; text-align: left; width: 100%;
    transition: background .15s;
  }
  .menu-item:hover { background: #2e5080; }
  .menu-item.active { background: #2563eb; color: #fff; font-weight: 600; }
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #toolbar {
    background: #fff; border-bottom: 1px solid #dde; padding: 10px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #toolbar h2 { font-size: 15px; flex: 1; }
  .btn {
    padding: 6px 14px; border-radius: 5px; border: 1px solid #c0cfe0;
    background: #fff; cursor: pointer; font-size: 12px; font-family: inherit;
    transition: background .15s;
  }
  .btn:hover { background: #f0f4f8; }
  .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn-primary:hover { background: #1d4ed8; }
  #content { padding: 24px; flex: 1; }

  /* ===== DATA INPUT FORM ===== */
  .input-section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .input-section h3 { font-size: 13px; color: #1e3a5f; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #e8f0fe; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .input-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: #555; font-weight: 600; }
  .field input, .field select {
    padding: 7px 9px; border: 1px solid #c8d8e8; border-radius: 4px;
    font-size: 13px; font-family: inherit; background: #f8fbff;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #2563eb; background: #fff; }
  .field.highlight input { background: #fffde7; border-color: #f9a825; }

  /* ===== DOCUMENT VIEW ===== */
  .doc-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 8px; }
  .doc-page {
    width: 794px; min-height: 1123px; margin: 0 auto; padding: 60px 70px;
    font-family: '바탕', 'Batang', '굴림', serif; font-size: 11pt;
    line-height: 1.7; background: #fff; position: relative;
  }
  .doc-title {
    text-align: center; font-size: 18pt; font-weight: bold;
    letter-spacing: 6px; margin-bottom: 30px; font-family: '바탕', serif;
  }
  .doc-subtitle { text-align: center; font-size: 13pt; margin-bottom: 20px; }
  table.doc-table {
    width: 100%; border-collapse: collapse; margin-bottom: 12px;
  }
  table.doc-table td, table.doc-table th {
    border: 1px solid #333; padding: 5px 8px; vertical-align: middle;
    font-size: 10.5pt;
  }
  table.doc-table th { background: #f5f5f5; text-align: center; font-weight: bold; }
  .label-cell { background: #f9f9f9; text-align: center; font-weight: bold; white-space: nowrap; }
  .sign-area { text-align: right; margin-top: 30px; line-height: 2.2; }
  .sign-line { display: inline-block; min-width: 120px; border-bottom: 1px solid #333; margin-left: 8px; }
  .doc-body { text-indent: 0; margin-bottom: 10px; }
  .doc-indent { margin-left: 20px; }
  .num-item { margin-bottom: 6px; }
  .seal-box {
    display: inline-block; width: 60px; height: 60px; border: 1px solid #aaa;
    text-align: center; line-height: 60px; font-size: 9pt; color: #aaa;
    vertical-align: middle; margin-left: 8px;
  }
  .right-align { text-align: right; }
  .center { text-align: center; }
  .bold { font-weight: bold; }
  .underline { text-decoration: underline; }
  .mt10 { margin-top: 10px; }
  .mt20 { margin-top: 20px; }
  .mt30 { margin-top: 30px; }
  .mb10 { margin-bottom: 10px; }
  .small { font-size: 9pt; }

  /* ===== EDITABLE DOC ===== */
  [contenteditable="true"] td:not([contenteditable="false"]):hover {
    background: #fffde7; cursor: text;
  }
  [contenteditable="true"] td:not([contenteditable="false"]):focus {
    outline: 2px solid #2563eb; background: #eff6ff;
  }
  [contenteditable="true"] { outline: none; }

  /* ===== 인터랙티브 체크박스 ===== */
  .cb-group { display: inline-flex; flex-direction: column; gap: 3px; }
  .cb-opt {
    cursor: pointer; white-space: nowrap; font-size: 10.5pt;
    padding: 1px 4px; border-radius: 3px; transition: background .1s;
    user-select: none;
  }
  .cb-opt:hover { background: #fffde7; }
  .cb-opt.cb-checked { font-weight: 700; color: #000; }
  /* 선택되면 선택 안 된 항목 숨김 */
  .cb-has-check .cb-opt:not(.cb-checked) { display: none; }
  @media print {
    .cb-opt:not(.cb-checked) { display: none !important; }
  }

  /* ===== PRINT ===== */
  @media print {
    #sidebar, #toolbar { display: none !important; }
    #app { display: block; }
    #main { overflow: visible; }
    #content { padding: 0; }
    .doc-wrap { box-shadow: none; padding: 0; border-radius: 0; }
    .doc-page {
      width: 210mm !important;
      padding: 15mm 18mm !important;
      min-height: auto !important;
      max-height: 277mm !important;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      transform-origin: top left;
    }
    .no-print { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <h1>용역 계약 빨리 끝내기<span>자동 서식 생성 프로그램</span></h1>

<script>
// ===== DATA =====
const D = {
  역명: '서연중 시설관리 및 청소용역',
  기관명: '서연중학교',
  기관주소: '경기도 화성시 00로 00길 000',
  구분: '공립',
  기관대표: '○○○',
  담당자: '주무관 ○○○',
  검사자: '행정실장 ○○○',
  업체명: '○○종합기술',
  업체대표: '○○○',
  전화: '031-0000-0000',
  업체주소: '경기도 화성시 00로 00길 000',
  업종: '소규모테마형교육여행',
  은행: '00은행',
  사업자번호: '1234567890',
  계좌: '000-000000-00-000',
  계약금액: 52,345,600,
  보증금액: 5,234,560,
  계약일: '2020-10-10',
  착수일: '2020-10-10',
  준공기한: '2020-10-20',
  실제준공일: '2020-10-20',
  준공검사일: '2020-10-20',
  하자담보: '1년',
  지연배상금율: '1.3/1000',
  계약보증금납부: '이행보증증권',
  계약번호: '10',
  공고번호: '9',
  계약방법: '총액계약',
};

// helpers
function fmt(n) {
  if (!n && n !== 0) return '';
  return Number(n).toLocaleString('ko-KR');
}
function won(n) {
  if (!n && n !== 0) return '';
  const num = Number(n);
  return `금 ${fmt(num)} 원(금 ${numToKorean(num)} 원정)`;
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}년${String(d.getMonth()+1).padStart(2,'0')}월${String(d.getDate()).padStart(2,'0')}일`;
}
function fmtDateDot(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function numToKorean(num) {
  if (!num) return '영';
  const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const positions = ['', '십', '백', '천'];
  const bigUnits = ['', '만', '억', '조'];
  let result = '';
  const str = String(Math.floor(Number(num)));
  const len = str.length;
  for (let i = 0; i < len; i++) {
    const digit = parseInt(str[i]);
    const pos = len - 1 - i;
    const bigPos = Math.floor(pos / 4);
    const smallPos = pos % 4;
    if (digit === 0) continue;
    result += (digit === 1 && smallPos > 0 ? '' : units[digit]) + positions[smallPos];
    if (smallPos === 0) result += bigUnits[bigPos];
  }
  return result || '영';
}

function get(key) { return D[key] || ''; }

// ===== PAGES =====
const pages = {
  input: { title: '데이터 입력', render: renderInput },
  integrated: { title: '계약이행 통합 서약서', render: renderIntegrated },
  contract: { title: '용역표준계약서', render: renderContract },
  accounting: { title: '관련 회계예규 적용', render: renderAccounting },
  acceptance: { title: '승낙사항', render: renderAcceptance },
  seal: { title: '사용인감계', render: renderSeal },
  bond: { title: '계약보증금납부서', render: renderBond },
  bond_confirm: { title: '계약보증금 지급확약서', render: renderBondConfirm },
  integrity: { title: '청렴서약서', render: renderIntegrity },
  contract_memo: { title: '수의계약 각서', render: renderContractMemo },
  contract_check: { title: '수의계약 체결 제한 여부 확인서', render: renderContractCheck },
  tax: { title: '조세포탈 관련 각서', render: renderTax },
  privacy: { title: '개인정보보안서약서', render: renderPrivacy },
  labor: { title: '근로자 권리보호 이행서약서', render: renderLabor },
  security_rep: { title: '보안서약서(업체대표)', render: renderSecurityRep },
  security_staff: { title: '보안서약서(참여인력)', render: renderSecurityStaff },
  start: { title: '착수계', render: renderStart },
  labor_agree: { title: '노무비구분·지급합의서', render: renderLaborAgree },
  labor_exclude: { title: '노무비구분·지급제외확인서', render: renderLaborExclude },
  labor_mgmt: { title: '노무비구분관리제외확인서', render: renderLaborMgmt },
  labor_pay: { title: '노무비지급내역서', render: renderLaborPay },
  security_end: { title: '보안확약서(사업종료시)', render: renderSecurityEnd },
  complete: { title: '완수확인서', render: renderComplete },
  payment: { title: '대금청구서', render: renderPayment },
};

// ===== 체크박스 인터랙션 =====
function pickCB(el) {
  const group = el.closest('.cb-group');
  const opts  = group.querySelectorAll('.cb-opt');
  const wasChecked = el.classList.contains('cb-checked');
  // 모두 초기화
  opts.forEach(o => {
    o.classList.remove('cb-checked');
    o.textContent = o.textContent.replace('[✓]', '[ ]');
  });
  group.classList.remove('cb-has-check');
  // 이미 체크된 걸 다시 클릭 → 해제(토글)
  if (!wasChecked) {
    el.classList.add('cb-checked');
    el.textContent = el.textContent.replace('[ ]', '[✓]');
    group.classList.add('cb-has-check');
  }
}

// cb-group HTML 생성 헬퍼
let _cbIdx = 0;
function cbGroup(...opts) {
  return `<div class="cb-group">${
    opts.map(o => `<span class="cb-opt" onclick="pickCB(this)">[ ] ${o}</span>`).join('')
  }</div>`;
}

function showPage(id) {
  document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
  const allBtns = document.querySelectorAll('.menu-item');
  allBtns.forEach(btn => {
    if (btn.getAttribute('onclick') === `showPage('${id}')`) btn.classList.add('active');
  });
  const p = pages[id];
  if (!p) return;
  document.getElementById('page-title').textContent = p.title;
  document.getElementById('content').innerHTML = p.render();
  if (id !== 'input') {
    const dp = document.querySelector('.doc-page');
    if (dp) { dp.contentEditable = 'true'; dp.spellcheck = false; }
    document.querySelectorAll('.label-cell, th').forEach(el => el.contentEditable = 'false');
    const badge = document.getElementById('edit-badge');
    if (badge) badge.style.display = 'inline-block';
  } else {
    const badge = document.getElementById('edit-badge');
    if (badge) badge.style.display = 'none';
  }
}

// ===== INPUT PAGE (통합) =====
function renderInput() {
  return `
  <form oninput="updateData()" onsubmit="return false;">
  <div class="input-section" style="background:#e8f0fe; padding:12px 20px;">
    <p style="color:#1e3a5f; font-size:13px; font-weight:600;">📋 데이터 입력 — 한 번만 입력하면 모든 서식(용역 계약 + 중대재해 안전서류)이 자동 생성됩니다.</p>
    <p style="color:#555; font-size:11px; margin-top:4px;">강조(노란색) 항목이 핵심 필드입니다.</p>
  </div>

  <div class="input-section">
    <h3>1. 발주기관 (학교)</h3>
    <div class="input-grid">
      <div class="field highlight"><label>기관명 / 학교명</label><input id="f_기관명" value="${D.기관명}" oninput="S.학교명=this.value"></div>
      <div class="field"><label>기관 주소</label><input id="f_기관주소" value="${D.기관주소}" oninput="S.학교주소=this.value"></div>
      <div class="field"><label>공/사립 구분</label>
        <select id="f_구분"><option ${D.구분==='공립'?'selected':''}>공립</option><option ${D.구분==='사립'?'selected':''}>사립</option></select>
      </div>

function updateData() {
  const fields = ['역명','기관명','기관주소','구분','기관대표','담당자','검사자',
    '업체명','업체대표','전화','업체주소','업종','은행','사업자번호','계좌',
    '계약금액','보증금액','계약보증금납부','계약일','착수일','준공기한',
    '실제준공일','준공검사일','하자담보','지연배상금율','계약번호','공고번호','계약방법'];
  fields.forEach(k => {
    const el = document.getElementById('f_'+k);
    if (el) D[k] = el.value;
  });
  // S 객체 동기화
  S.학교명 = D.기관명;
  S.학교주소 = D.기관주소;
  S.학교대표 = D.기관대표;
  S.계약명 = D.역명;
  S.계약체결일 = D.계약일;
  S.계약시작 = D.착수일;
  S.계약종료 = D.준공기한;
  S.계약금액s = Number(D.계약금액).toLocaleString('ko-KR');
  S.업체명s = D.업체명;
  S.업체대표s = D.업체대표;
  S.업체전화 = D.전화;
  S.업체주소s = D.업체주소;
  S.업체사업자 = D.사업자번호;
  // 담당자/안전담당자 파싱 (직 성명 분리)
  const dm = document.getElementById('f_담당자');
  if (dm) { const parts = dm.value.split(' '); S.담당자직 = parts[0]||''; S.담당자명 = parts.slice(1).join(' ')||dm.value; }
  const am = document.getElementById('f_안전담당');
  if (am) { const parts = am.value.split(' '); S.안전담당직 = parts[0]||''; S.안전담당명 = parts.slice(1).join(' ')||am.value; }
  const at = document.getElementById('f_안전담당전화');
  if (at) S.안전담당전화 = at.value;
  const gn = document.getElementById('f_고유번호');
  if (gn) S.고유번호 = gn.value;
}

// ===== 한 페이지 인쇄 =====
// A4 인쇄 영역: 가로 794px, 세로 1123px (96dpi 기준), 여백 제외 후 약 1050px
const PRINT_H = 1050;
const PRINT_W = 756;

window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.doc-page').forEach(page => {
    // 일시적으로 transform 제거 후 실제 크기 측정
    page.style.transform = '';
    const h = page.scrollHeight;
    const w = page.scrollWidth;
    const scale = Math.min(1, PRINT_H / h, PRINT_W / w);
    if (scale < 1) {
      page.style.transform = `scale(${scale})`;
      page.style.transformOrigin = 'top left';
      // transform은 레이아웃 공간을 줄이지 않으므로 여백 보정
      page.style.marginBottom = `${(scale - 1) * h}px`;
      page.style.marginRight = `${(scale - 1) * w}px`;
    }
  });
});

window.addEventListener('afterprint', () => {
  document.querySelectorAll('.doc-page').forEach(page => {
    page.style.transform = '';
    page.style.transformOrigin = '';
    page.style.marginBottom = '';
    page.style.marginRight = '';
  });
});

// Init
showPage('input');
</script>
